
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente - OficinaPro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <h2>OficinaPro</h2>

            <nav>
                <a href="/">Dashboard</a>
                <a href="/#clientes">Clientes</a>
                <a href="/veiculos">Veículos</a>
                <a href="/ordens-servico">Ordens de Serviço</a>
            </nav>
        </aside>

        <main class="conteudo">
            <header>
                <h1>Editar cliente</h1>
                <p>Atualize as informações do cliente cadastrado.</p>
            </header>

            <section class="painel">
                <form
                    action="{{ url_for('editar_cliente', id=cliente.id) }}"
                    method="POST"
                >
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            value="{{ cliente.nome }}"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input
                            type="text"
                            id="telefone"
                            name="telefone"
                            value="{{ cliente.telefone or '' }}"
                        >
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            value="{{ cliente.email or '' }}"
                        >
                    </div>

                    <button type="submit">Salvar alterações</button>

                    <a href="/" class="botao-voltar">Cancelar</a>
                </form>
            </section>
        </main>
    </div>

</body>
</html>

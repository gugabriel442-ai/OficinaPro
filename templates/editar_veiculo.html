
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Veículo - OficinaPro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <h2>OficinaPro</h2>

            <nav>
                <a href="/">Dashboard</a>
                <a href="/#clientes">Clientes</a>
                <a href="/veiculos">Veículos</a>
                <a href="/ordens-servico">Ordens de Serviço</a>
            </nav>
        </aside>

        <main class="conteudo">
            <header>
                <h1>Editar veículo</h1>
                <p>Atualize os dados do veículo cadastrado.</p>
            </header>

            <section class="painel">
                <form
                    action="{{ url_for('editar_veiculo', id=veiculo.id) }}"
                    method="POST"
                >
                    <div class="campo">
                        <label for="cliente_id">Proprietário</label>

                        <select id="cliente_id" name="cliente_id" required>
                            {% for cliente in clientes %}
                            <option
                                value="{{ cliente.id }}"
                                {% if cliente.id == veiculo.cliente_id %}selected{% endif %}
                            >
                                {{ cliente.nome }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="campo">
                        <label for="marca">Marca</label>
                        <input
                            type="text"
                            id="marca"
                            name="marca"
                            value="{{ veiculo.marca }}"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="modelo">Modelo</label>
                        <input
                            type="text"
                            id="modelo"
                            name="modelo"
                            value="{{ veiculo.modelo }}"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="ano">Ano</label>
                        <input
                            type="number"
                            id="ano"
                            name="ano"
                            min="1886"
                            max="2100"
                            value="{{ veiculo.ano }}"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="placa">Placa</label>
                        <input
                            type="text"
                            id="placa"
                            name="placa"
                            maxlength="10"
                            value="{{ veiculo.placa }}"
                            required
                        >
                    </div>

                    <button type="submit">Salvar alterações</button>
                    <a href="/veiculos" class="botao-voltar">Cancelar</a>
                </form>
            </section>
        </main>
    </div>

</body>
</html>
